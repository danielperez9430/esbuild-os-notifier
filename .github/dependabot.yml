version: 2

# One monthly batch per ecosystem; minor and patch updates share a pull request.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # TypeScript 7 is the native compiler, and @rollup/plugin-typescript cannot
    # build with it. Stay on 5.x minors and patches until the plugin can.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
